<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training</title>
<meta name="description" content="A simple training log with shuffled workouts, rest timer and weekly goals.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7; --s1:#FFFFFF; --s2:#E8E8ED; --line:#DCDCE1; --ink:#0B0B0D; --mut:#6E6E73; --dim:#B4B4BA;
  --pic:#121215; --neon:#1FD873; --neon-ink:#00140A; --neon-txt:#0E9F50; --neon-d:#CFEFDC; --red:#E5372B; --glow:none;
  /* colour system: weight, reps, working countdown, rest, remove (light mode uses deeper shades) */
  --kg:#007A8F; --kg-bg:rgba(0,122,143,.07); --reps:#7438D9; --reps-bg:rgba(116,56,217,.07);
  --hold:#D41F1F; --hold-ink:#FFFFFF; --rest:#1F5BD6; --del:#9E3B34;
  --flash:#0B0B0D; --rest-glow:none; --hold-glow:none;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --s1:#0C0C0E; --s2:#16161A; --line:#1E1E22; --ink:#F5F5F7; --mut:#8A8A90; --dim:#3C3C42;
    --pic:#0C0C0E; --neon:#3DFF8F; --neon-ink:#000000; --neon-txt:#3DFF8F; --neon-d:#123A24; --red:#FF5B4F;
    --glow:drop-shadow(0 0 10px rgba(61,255,143,.5)) drop-shadow(0 0 2px rgba(61,255,143,.9));
    --kg:#00E5FF; --kg-bg:rgba(0,229,255,.06); --reps:#B57BFF; --reps-bg:rgba(181,123,255,.07);
    --hold:#FF3B3B; --hold-ink:#000000; --rest:#4D8BFF; --del:#C0605A;
    --flash:#FFFFFF; --rest-glow:drop-shadow(0 0 8px rgba(77,139,255,.6)); --hold-glow:drop-shadow(0 0 10px rgba(255,59,59,.55));
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --s1:#0C0C0E; --s2:#16161A; --line:#1E1E22; --ink:#F5F5F7; --mut:#8A8A90; --dim:#3C3C42;
  --pic:#0C0C0E; --neon:#3DFF8F; --neon-ink:#000000; --neon-txt:#3DFF8F; --neon-d:#123A24; --red:#FF5B4F;
  --glow:drop-shadow(0 0 10px rgba(61,255,143,.5)) drop-shadow(0 0 2px rgba(61,255,143,.9));
  --kg:#00E5FF; --kg-bg:rgba(0,229,255,.06); --reps:#B57BFF; --reps-bg:rgba(181,123,255,.07);
  --hold:#FF3B3B; --hold-ink:#000000; --rest:#4D8BFF; --del:#C0605A;
  --flash:#FFFFFF; --rest-glow:drop-shadow(0 0 8px rgba(77,139,255,.6)); --hold-glow:drop-shadow(0 0 10px rgba(255,59,59,.55));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--neon);outline-offset:3px;border-radius:6px}
#app{max-width:520px;margin:0 auto;padding-bottom:180px}
body.focusing #app{padding-bottom:0}
.pad{padding:28px 24px 0}
.pad2{padding:18px 24px 0}
.eyebrow{font-size:13px;color:var(--mut);font-weight:500}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em;margin:4px 0 0}
h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.lead{margin:22px 24px 0;color:var(--mut);font-size:15px;max-width:34ch}
.link{font-size:14px;font-weight:500;color:var(--mut)}
.link:active{color:var(--ink)}
.danger{color:var(--del)}

/* hero ring */
.hero{position:relative;width:220px;height:220px;margin:18px auto 0}
.hero svg{width:100%;height:100%;overflow:visible}
.seg{fill:none;stroke:var(--neon-d);stroke-width:14;stroke-linecap:round}
.seg.on{stroke:var(--neon);filter:var(--glow)}
.hero-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero-n{font-size:64px;font-weight:200;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.hero-n span{color:var(--dim)}
.hero-l{font-size:13px;color:var(--mut);margin-top:6px}
.month{display:flex;align-items:center;gap:12px;margin:18px 24px 0;font-size:13px;color:var(--mut)}
.mbar{flex:1;height:3px;background:var(--s2);border-radius:2px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .4s}
.mbar i.met{background:var(--neon)}
.month b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* lists */
.list{margin:24px 24px 0}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mut);margin-bottom:4px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line)}
.row .n{width:16px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.row .nm{flex:1;min-width:0;font-size:15px;font-weight:500;line-height:1.3}
.row .nm small{display:block;font-size:12.5px;color:var(--mut);font-weight:400;margin-top:2px}
.row .m{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .m b{color:var(--ink);font-weight:500;min-width:46px;text-align:right}
.row .m b.dim{color:var(--mut);font-weight:400}
.row.done .nm{color:var(--mut)}
.row .ok svg{width:18px;height:18px;stroke:var(--neon-txt);display:block}
.row .part{color:var(--neon-txt);font-weight:600}
.row.static{cursor:default}
.list-foot{display:flex;gap:22px;padding:16px 0 0}

/* dock + buttons */
.dock{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:28px 24px 14px;background:linear-gradient(to bottom,transparent,var(--bg) 40%);z-index:15;max-width:520px;margin:0 auto}
.cta{display:flex;align-items:center;justify-content:center;width:100%;height:58px;border-radius:29px;background:var(--neon);color:var(--neon-ink);font-weight:700;font-size:17px;letter-spacing:-.01em}
.cta:active{transform:scale(.98)}
.cta.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.cta.wide{margin-top:18px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:20px;color:var(--mut)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor}

/* focus mode */
.focus{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.ftop{display:flex;align-items:center;gap:12px;padding:14px 16px 0 12px}
.segs{flex:1;display:flex;gap:4px}
.sg{flex:1;height:22px;position:relative}
.sg::after{content:"";position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:var(--s2)}
.sg.d::after{background:var(--neon)}
.sg.c::after{background:var(--ink)}
.cnt{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.fbody{flex:1;padding:26px 24px 0}
.grp{font-size:13px;color:var(--mut)}
.fname{font-size:30px;line-height:1.12;letter-spacing:-.03em;margin:6px 0 0}
.how{margin:12px 0 0;font-size:14.5px;line-height:1.5;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.how.open{display:block}
.fpic{margin:16px 0 0;border-radius:24px;background:var(--pic);border:1px solid var(--line);overflow:hidden}
.fpic img{display:block;width:100%;aspect-ratio:4/3;max-height:30vh;max-height:30dvh;object-fit:contain}
.sheet-b .fpic img{max-height:38vh;max-height:38dvh}
.more{margin-top:4px;color:var(--ink)}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0 0}
.num{min-width:0;border-radius:22px;padding:14px 14px 14px;background:var(--s1);box-shadow:inset 0 0 0 1.5px var(--line)}
.num.kg{color:var(--kg);background:var(--kg-bg);box-shadow:inset 0 0 0 1.5px var(--kg)}
.num.reps{color:var(--reps);background:var(--reps-bg);box-shadow:inset 0 0 0 1.5px var(--reps)}
.num.secs{color:var(--hold)}
.big{display:block;width:100%;min-width:0;border:0;background:transparent;color:inherit;padding:0;font-size:clamp(40px,13vw,60px);height:clamp(44px,14.3vw,66px);font-weight:300;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums;caret-color:currentColor}
.big.l4{font-size:clamp(34px,11vw,54px)}
.big.l5{font-size:clamp(28px,9vw,46px)}
.big::placeholder{color:currentColor;opacity:.35}
.u{font-size:13px;font-weight:600;color:inherit;opacity:.85;margin-top:2px}
.step{display:flex;gap:8px;margin-top:12px}
.step button{flex:1;max-width:56px;height:44px;border-radius:22px;border:1.5px solid currentColor;color:inherit;font-size:22px;font-weight:400;display:grid;place-items:center}
.kg .step button:active{background:var(--kg);color:var(--bg)}
.reps .step button:active{background:var(--reps);color:var(--bg)}
.secs .step button:active{background:var(--hold);color:var(--bg)}
.sets{display:flex;flex-wrap:wrap;gap:12px;margin:32px 0 0}
.sw{position:relative}
.set{width:46px;height:46px;border-radius:23px;border:1.5px solid var(--neon-txt);color:var(--neon-txt);font-size:14px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.set.done{background:var(--neon);border-color:var(--neon);color:var(--neon-ink)}
.set svg{width:20px;height:20px;stroke:currentColor}
.set.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.sumv{flex-direction:column;align-items:flex-end;gap:2px}
.sumv b.kgv{color:var(--kg)}
.sumv b.repsv{color:var(--reps)}
.sm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.sm-grid div{border-radius:18px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px;min-width:0}
.sm-grid b{display:block;font-size:28px;font-weight:300;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-grid span{display:block;font-size:12.5px;color:var(--mut);margin-top:4px}
.sm-grid .kgc b{color:var(--kg)}
.sm-grid .repsc b{color:var(--reps)}
.sm-cmp{margin:12px 0 0;font-size:14px;color:var(--mut)}
.sm-cmp b{color:var(--ink)}
.sm-cmp b.good{color:var(--neon-txt)}
.sm-h{font-size:15px;font-weight:700;margin:22px 0 0}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mchips span{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:12px;background:var(--s2)}
.hl{list-style:none;margin:10px 0 0;padding:0}
.hl li{display:flex;gap:10px;align-items:baseline;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.hl li span:last-child{min-width:0}
.upmark{color:var(--neon-txt);font-size:11px}
.recs{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.rec{border-radius:16px;padding:12px 14px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;line-height:1.4}
.rec b{display:block;font-size:13px;margin-bottom:2px}
.rec.plateau{box-shadow:inset 0 0 0 1.5px var(--neon)}
.utoast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:22px;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgb(0 0 0 / .35);animation:udrop .2s ease-out}
.utoast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.utoast button{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--bg);color:var(--ink);font-weight:700;font-size:14px}
@keyframes udrop{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.rest.over .rest-t{color:var(--mut)}
#ctaBox{display:flex;flex-direction:column;gap:10px}
.set.cur{outline:2px solid var(--ink);outline-offset:3px}
.set.add{border:1.5px dashed var(--dim);color:var(--mut);font-size:20px;font-weight:300}
.setx{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:11px;background:var(--bg);border:1px solid var(--line);color:var(--del);display:grid;place-items:center}
.setx svg{width:12px;height:12px;stroke:currentColor}
.last{margin-top:22px;font-size:13px;color:var(--mut);line-height:1.5}
.last b{color:var(--ink);font-weight:500}
.last .up{color:var(--neon-txt);font-weight:500}
.rested{margin:2px 0 6px;font-size:12.5px;color:var(--mut)}
.toggle.ngt{padding:12px 0;border-bottom:1px solid var(--line)}
.toggle.ngt b{display:block;font-size:15px;font-weight:600}
.toggle.ngt small{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.ngwrap{margin:18px 24px 0}
.ngwrap .toggle.ngt{border:1px solid var(--line);border-radius:18px;padding:12px 16px;background:var(--s1)}
.ngtag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 6px;border-radius:6px;border:1px solid var(--neon-txt);color:var(--neon-txt);margin-right:6px;vertical-align:1px}
.hint{margin-top:18px;font-size:14px;color:var(--mut)}
.prbadge{display:inline-block;vertical-align:middle;font-size:12px;font-weight:700;letter-spacing:.02em;line-height:1;padding:6px 9px;border-radius:12px;background:var(--neon);color:var(--neon-ink);box-shadow:0 0 14px rgba(61,255,143,.35)}
.prbadge.sm{font-size:10.5px;padding:4px 7px}
.prdot{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:800;line-height:1;padding:3px 5px;border-radius:8px;background:var(--ink);color:var(--bg)}
.toast.pr{background:var(--neon);color:var(--neon-ink);box-shadow:0 0 24px rgba(61,255,143,.5)}
.hint .up{color:var(--neon-txt);font-weight:600}
.hint.plateau{position:relative;border:1px solid var(--neon-d);background:var(--s1);border-radius:18px;padding:14px 48px 14px 16px;color:var(--ink)}
.hint.plateau .up{color:var(--ink);font-weight:600;line-height:1.4}
.hint .hx{position:absolute;top:6px;right:6px}
.row .nm small.goup{color:var(--neon-txt);font-weight:500}
.hopts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hopts .chip{height:36px;color:var(--ink)}
.tools{display:flex;gap:22px;margin:26px 0 0;flex-wrap:wrap}
.fdock{position:sticky;bottom:0;padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.rest{border:1px solid var(--line);background:var(--s1);border-radius:20px;padding:10px 16px 8px}
.rest-top{display:flex;align-items:baseline;justify-content:space-between}
.rest-l{font-size:13px;color:var(--mut);font-weight:500}
.rest-t{display:inline-block;font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--rest);transition:color .2s}
.rest-t.last5,.hold-t.last5{color:var(--flash);animation:pulse5 1s ease-in-out infinite}
@keyframes pulse5{50%{opacity:.55;transform:scale(1.06)}}
.rest-line{height:3px;border-radius:2px;background:var(--s2);margin:8px 0 6px;overflow:hidden}
.rest-line i{display:block;height:100%;background:var(--rest);transform-origin:left;filter:var(--rest-glow)}
.rest.hold .rest-t{color:var(--hold)}
.rest.hold .rest-line i{background:var(--hold);filter:var(--hold-glow)}
.rest-b{display:flex;align-items:center;gap:22px}
.rest-b .sp{flex:1}
.rest-b .mute{display:flex;align-items:center;gap:6px}
.rest-b .mute svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nums.one{grid-template-columns:1fr}
.nums.one .step button{max-width:none;padding:0 18px;font-size:16px;font-weight:600}
.cta.go{animation:go 1.2s ease-in-out infinite}
@keyframes go{50%{box-shadow:0 0 38px rgba(61,255,143,.65);transform:scale(1.015)}}
@media (prefers-reduced-motion:reduce){.cta.go,.set.pop,.utoast,.rest-t.last5,.hold-t.last5{animation:none}}
.upnext{margin:22px 0 0;padding:16px;border-radius:24px;background:var(--s1);box-shadow:inset 0 0 0 1.5px var(--neon)}
.upnext.done{box-shadow:inset 0 0 0 1.5px var(--line)}
.un-row{display:flex;gap:14px;align-items:center;min-width:0}
.un-pic{flex:none;width:96px;height:72px;border-radius:16px;background:var(--pic);overflow:hidden}
.un-pic img{display:block;width:100%;height:100%;object-fit:contain}
.un-txt{min-width:0}
.un-eye{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--neon-txt)}
.un-name{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:3px;overflow-wrap:anywhere}
.un-sub{font-size:13px;color:var(--mut);margin:4px 0 0}
.cta.un-go{margin-top:16px;height:52px;font-size:16px;padding:0 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:52px;text-align:center}

/* exercises */
.search{width:100%;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--s1);padding:0 18px}
.search::placeholder{color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -24px 0;padding:0 24px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;margin:14px 0 0;padding:0}
.chip{white-space:nowrap;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--mut)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* history */
.stats{display:flex;gap:30px;margin:28px 24px 0}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:54px;font-weight:200;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--mut);margin-top:6px}
.stats .n b{color:var(--neon-txt)}
.stats.sm{margin:20px 0 0;gap:26px}
.stats.sm b{font-size:40px}
.weeks{display:flex;gap:6px;margin:28px 24px 0;height:48px;align-items:flex-end}
.wk{flex:1;display:flex;flex-direction:column-reverse;gap:3px}
.wk i{height:12px;border-radius:3px;background:var(--s2)}
.wk i.on{background:var(--neon)}
.wl{display:flex;justify-content:space-between;margin:8px 24px 0;font-size:11px;color:var(--mut)}
.sess{border-bottom:1px solid var(--line)}
.sess summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 0;cursor:pointer}
.sess summary::-webkit-details-marker{display:none}
.sess summary b{display:block;font-size:16px;font-weight:600}
.sess summary small{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.sess .m{font-size:13px;color:var(--mut)}
.sess ul{list-style:none;margin:0;padding:0 0 12px}
.sess li{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:14px}
.sess li span:last-child{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.sess .link{display:block;margin:0 0 14px}
.settings{margin:36px 24px 0;padding-top:20px;border-top:1px solid var(--line)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:16px;font-size:15px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);font-size:20px;font-weight:300}
.stepper output{font-size:22px;font-weight:300;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.fine{font-size:12.5px;color:var(--mut);margin:16px 0 0}
h2.sub{font-size:16px;margin:28px 0 0}
/* body */
.banner{margin:18px 24px 0;padding:14px 16px;border:1px solid var(--neon-d);background:var(--s1);border-radius:20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.banner p{flex:1 1 170px;margin:0;font-size:14px;line-height:1.4}
.banner p small{display:block;color:var(--mut);font-size:12.5px}
.pill{height:38px;padding:0 16px;border-radius:19px;background:var(--neon);color:var(--neon-ink);font-weight:700;font-size:14px;white-space:nowrap}
.bstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:24px 24px 0}
.bstats div{display:flex;flex-direction:column;min-width:0}
.bstats b{font-size:clamp(22px,8vw,34px);font-weight:200;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.bstats b small{font-size:clamp(11px,3.4vw,14px);letter-spacing:0;margin-left:2px;color:var(--mut)}
.bstats span{font-size:12.5px;color:var(--mut);margin-top:6px}
.bstats em{font-style:normal}
.good{color:var(--neon-txt)}
.goal{margin:16px 24px 0;font-size:13px;color:var(--mut)}
.box{margin:24px 24px 0}
.box .chart{margin-top:8px}
.box.flush{margin:22px 0 0}
.prof{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;margin:12px 0 0;font-size:14px}
.prof span{color:var(--mut);display:block;font-size:12.5px}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:13px;color:var(--mut);margin:0 0 6px 4px}
.field input{width:100%;min-width:0;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--s1);padding:0 16px;font-size:16px;-webkit-appearance:none;appearance:none}
.field input:focus{outline:2px solid var(--neon);outline-offset:1px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;font-size:15px}
.toggle i{flex:none;width:46px;height:28px;border-radius:14px;background:var(--s2);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgb(0 0 0 / .3);transition:transform .2s}
.toggle[aria-pressed="true"] i{background:var(--neon)}
.toggle[aria-pressed="true"] i::after{transform:translateX(18px)}
.cta.half{height:48px;font-size:15px;flex:1}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
body.focusing .nav{display:none}
.nav>div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{padding:11px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--mut)}
.nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.nav i{width:5px;height:5px;border-radius:50%}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] i{background:var(--neon);box-shadow:0 0 8px var(--neon)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88vh;border-radius:24px 24px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:18px 16px 6px 24px}
.sheet-h h2{flex:1}
.sheet-b{overflow-y:auto;padding:0 24px 28px}
.sheet-b .list{margin:18px 0 0}
.sheet-b .how{-webkit-line-clamp:unset}
.chart{margin-top:20px}
.chart svg{display:block;width:100%;height:auto}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:600;font-size:14px;z-index:40;white-space:nowrap;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .cta:not(.ghost){box-shadow:0 0 28px rgba(61,255,143,.3)}
  :root:not([data-theme="light"]) .set.done{box-shadow:0 0 14px rgba(61,255,143,.4)}
  :root:not([data-theme="light"]) .stats .n b{text-shadow:0 0 18px rgba(61,255,143,.45)}
}
:root[data-theme="dark"] .cta:not(.ghost){box-shadow:0 0 28px rgba(61,255,143,.3)}
:root[data-theme="dark"] .set.done{box-shadow:0 0 14px rgba(61,255,143,.4)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.mbar i{transition:none}}
</style>

function suggestion(exId){

    case "kb": return nextOn(KB_LADDER, w, 4);
    case "plate": return nextOn(PLATE_LADDER, w, 5);

function plateauOf(exId){

  let n = 0; for(let k=tops.length-1; k>=0 && tops[k]===last; k--) n++;

function overloadHint(exId, dismissed=false){

  const last = h[h.length-1].it, sets = last.sets.filter(x=>(+x.w||0)>0 || (+x.r||0)>0);
  if(!sets.length) return null;

function computePRs(){

    const o = out[it.ex] || (out[it.ex] = {w:null, reps:null, time:null});
    it.sets.forEach(x=>{

      if(isTimed(it.ex)){ if(w>0 && (!o.time || w>o.time.w)) o.time = rec; return; }

  if(w>0 && w>bestW) return {kind:"weight", label:`${r1(w)} kg × ${r}`};
  const atLeast = prev.filter(p=>p.w>=w);
  if(r>0 && atLeast.length && r>Math.max(...atLeast.map(p=>p.r))) return {kind:"reps", label: w ? `${r} reps at ${r1(w)} kg` : `${r} reps`};
  return null;
}
/* ---------- muscle tags + recovery ---------- */
function musclesOf(id){
  if(typeof id==="number" && EX_MUSCLES[id]) return EX_MUSCLES[id].split("");
  if(NGMAP[id]) return NGMAP[id].m.split("");
  const e = exById(id); return (GROUP_MUSCLES[e?.group]||"").split("").filter(Boolean);
}
// Muscles hit in workouts finished in the last 48 hours.
function recentMuscles(hours=48){
  const since = Date.now() - hours*3600e3, out = new Set();
  S.sessions.forEach(s=>{ if(s.date && new Date(s.date).getTime()>=since) s.items.forEach(it=>musclesOf(it.ex).forEach(m=>out.add(m))); });
  return out;
}
const muscleNames = ms => [...ms].map(m=>MUSCLES[m]).filter(Boolean);
function buildItem(exId){
  const sg = suggestion(exId);
  return {ex:exId, sets:Array.from({length:sg.sets},()=>({w:sg.w||"", r:sg.reps||"", done:false}))};
}
function generate(){
  const sessions = allSessions(), n = sessions.length;
  const lastIdx = {}, freq = {}, groupLast = {};
  sessions.forEach((s,i)=>s.items.forEach(it=>{
    lastIdx[it.ex]=i; freq[it.ex]=(freq[it.ex]||0)+2;
    const e=exById(it.ex); if(e) groupLast[e.group]=i;
  }));
  const lastEx = new Set((sessions[n-1]?.items||[]).map(it=>it.ex));
  const count = S.settings.count || 7;
  const recent = recentMuscles(), pool = gymExercises();
  // an exercise is "fresh" when its main muscle wasn't trained in the last 48 h
  const fresh = e => { const m = musclesOf(e.id)[0]; return !m || !recent.has(m); };
  const freshGroups = ORDER.filter(g=>pool.some(e=>e.group===g && fresh(e)));
  const byRest = (a,b)=>(groupLast[a]??-1)-(groupLast[b]??-1);
  let slots = freshGroups.slice().sort(byRest).slice(0, count);
  const extras = ["legs","back","chest","shoulders"].filter(g=>freshGroups.includes(g));
  for(let k=0; slots.length<count && k<extras.length*2; k++){ const g=extras[k%extras.length];
    if(slots.filter(x=>x===g).length < 3 && pool.filter(e=>e.group===g && fresh(e)).length > slots.filter(x=>x===g).length) slots.push(g); }
  const tired = ORDER.filter(g=>!freshGroups.includes(g)).sort(byRest);
  for(const g of tired){ if(slots.length>=count) break; slots.push(g); }        // only when there's no other way
  const big = ["legs","back","chest","shoulders"];
  for(let k=0; slots.length<count && k<20; k++) slots.push(big[k%big.length]);
  slots.sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
  const chosen = new Set(), items = [];
  for(const g of slots){
    let cands = pool.filter(e=>e.group===g && !chosen.has(e.id) && !lastEx.has(e.id));
    if(!cands.length) cands = pool.filter(e=>e.group===g && !chosen.has(e.id));
    if(!cands.length) continue;
    if(cands.some(fresh)) cands = cands.filter(fresh);
    const pick = cands.map(e=>{
      const gap = Math.min(n-(lastIdx[e.id]??n-30), 30);
      const overlap = musclesOf(e.id).slice(1).filter(m=>recent.has(m)).length;
      return {e, s: gap*(0.5+Math.random()) + Math.log(1+(freq[e.id]||0)+(e.freq||0))*4 - overlap*6};
    }).sort((a,b)=>b.s-a.s)[0].e;
    chosen.add(pick.id); items.push(buildItem(pick.id));
  }
  const rested = muscleNames([...recent].filter(m=>!items.some(it=>musclesOf(it.ex)[0]===m)));
  S.plan = {created:new Date().toISOString(), items, v:2, rested};
  persistPlan();
}
/* ---------- no gym (travel) mode ---------- */
// Bodyweight stand-in for a gym exercise: same main muscle, closest movement pattern first.
function noGymFor(exId, used){
  const e = exById(exId); if(!e) return null;
  if(e.nogym) return exId;
  const n = e.name.toLowerCase(), ms = musclesOf(exId), m = ms[0], has = re => re.test(n);
  let pref = [];
  if(m==="C") pref = has(/incline|steep|low pulley/) ? ["decline-push-up","push-up","archer-push-up"] : ["push-up","archer-push-up","decline-push-up"];
  else if(m==="T") pref = has(/dips/) ? ["chair-dips","diamond-push-up"] : ["diamond-push-up","chair-dips"];
  else if(m==="S") pref = has(/press|snatch/) ? ["pike-push-up","plank-shoulder-taps","floor-y-t-raises"] : ["floor-y-t-raises","plank-shoulder-taps","pike-push-up"];
  else if(m==="K") pref = has(/pulldown|bar pull|behind/) ? ["towel-row","table-row","superman-raise"] : ["table-row","towel-row","superman-raise"];
  else if(m==="B") pref = ["towel-curl","door-frame-curl"];
  else if(m==="Q") pref = has(/wall sit|hold/) ? ["wall-sit","split-squat"] : has(/step/) ? ["chair-step-up","split-squat"] : has(/bulgarian|lunge/) ? ["rear-foot-elevated-split-squat","split-squat","chair-step-up"] : ["split-squat","rear-foot-elevated-split-squat","chair-step-up","wall-sit"];
  else if(m==="G") pref = ["single-leg-glute-bridge","single-leg-hip-hinge","split-squat"];
  else if(m==="H") pref = has(/curl/) ? ["towel-hamstring-slide","single-leg-glute-bridge"] : ["single-leg-hip-hinge","towel-hamstring-slide","single-leg-glute-bridge"];
  else if(m==="L") pref = ["superman-raise","single-leg-glute-bridge"];
  else if(m==="A") pref = isTimed(exId) ? ["forearm-plank","dead-bug"] : has(/leg raise|scissor|flutter|knee|swing/) ? ["lying-leg-raise","dead-bug","mountain-climbers"] : has(/plank|climb/) ? ["mountain-climbers","forearm-plank","dead-bug"] : ["dead-bug","lying-leg-raise","mountain-climbers","forearm-plank"];
  const ids = pref.map(x=>"ng-"+x)
    .concat(NOGYM.filter(x=>x.m[0]===m).map(x=>x.id))
    .concat(NOGYM.filter(x=>x.group===e.group).map(x=>x.id))
    .concat(NOGYM.filter(x=>ms.some(k=>x.m.includes(k))).map(x=>x.id))
    .filter(id=>NGMAP[id]);
  return ids.find(id=>!used.has(id)) || ids[0] || null;
}
function toNoGym(){
  const p = S.plan; if(!p || p.nogym) return;
  p.gymItems = JSON.parse(JSON.stringify(p.items));   // kept so switching back restores the gym workout
  const used = new Set();
  p.items = p.items.map(it=>{ const id = noGymFor(it.ex, used); if(id===null) return it; used.add(id); return id===it.ex ? it : buildItem(id); });
  p.nogym = true; persistPlan();
}
function toGym(){
  const p = S.plan; if(!p || !p.nogym) return;
  if(p.gymItems && p.gymItems.length){ p.items = p.gymItems; delete p.gymItems; p.nogym = false; persistPlan(); }
  else { generate(); }
}
function noGymToggle(on){
  return `<button class="toggle ngt" data-act="nogym" aria-pressed="${on}"><span><b>No gym</b><small>${on?"Bodyweight swaps, logged separately. This workout only.":"Travelling? Swap to bodyweight exercises."}</small></span><i></i></button>`;
}
function swap(i){
  const cur = S.plan.items[i], e = exById(cur.ex);
  const inPlan = new Set(S.plan.items.map(x=>x.ex));
  const lastEx = new Set((allSessions().slice(-1)[0]?.items||[]).map(x=>x.ex));
  const pool = S.plan.nogym ? nogymExercises() : gymExercises();
  let c = pool.filter(x=>x.group===e.group && !inPlan.has(x.id) && !lastEx.has(x.id));
  if(!c.length) c = pool.filter(x=>x.group===e.group && !inPlan.has(x.id));
  if(!c.length) return toast("No other "+GROUPS[e.group].toLowerCase()+" exercises yet");
  const recent = recentMuscles(), fc = c.filter(x=>!recent.has(musclesOf(x.id)[0]));
  if(fc.length) c = fc;
  const pick = c[Math.floor(Math.random()*c.length)];
  S.plan.items[i] = buildItem(pick.id);
  persistPlan(); render();
}

/* ---------- persistence ---------- */
function persistPlan(){
  S.updated = Date.now(); saveLocal();
  if(!db) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ ref("plan").set({plan:S.plan, updated:S.updated}).catch(()=>{}); }, 900);
}
function persistSettings(){
  saveLocal();
  if(db) ref("settings").set({settings:S.settings, custom:S.custom, profile:S.profile, weighins:S.weighins}).catch(()=>{});
}
function ref(id){ return db.collection("data/users/"+uid).doc(id); }
async function persistSession(s){
  saveLocal();
  if(!db) return;
  try{ await ref("s-"+s.id).set({session:s}); }
  catch(e){ if(e && e.code==="quota_exceeded") toast("Cloud storage is full. Saved on this phone only."); }
}
async function connect(){
  if(!window.claude || !window.claude.use) return;
  try{
    const [d,u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!d || !u) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    const snap = await db.collection("data/users/"+uid).get();
    let changed = false, cloudPlan = null;
    const have = new Set(S.sessions.map(s=>s.id));
    snap.docs.forEach(doc=>{
      const v = doc.data(); if(!v) return;
      if(doc.id==="plan") cloudPlan = v;
      else if(doc.id==="settings"){ if(v.settings) S.settings = Object.assign(S.settings, v.settings);
        (v.custom||[]).forEach(c=>{ if(!S.custom.find(x=>x.id===c.id)) S.custom.push(c); });
        if(v.profile && !Object.keys(S.profile).length) S.profile = v.profile;
        (v.weighins||[]).forEach(w=>{ if(w && w.id && !S.weighins.find(x=>x.id===w.id)) S.weighins.push(w); }); changed = true; }
      else if(doc.id.startsWith("s-") && v.session && !have.has(v.session.id)){ S.sessions.push(migrate(v.session)); changed = true; }
    });
    if(cloudPlan && (cloudPlan.updated||0) > (S.updated||0)){ S.plan = migrate(cloudPlan.plan); S.updated = cloudPlan.updated; changed = true; }
    // push anything only on this phone
    const cloudIds = new Set(snap.docs.map(d=>d.id));
    for(const s of S.sessions) if(!cloudIds.has("s-"+s.id)) await ref("s-"+s.id).set({session:s}).catch(()=>{});
    if(changed){ saveLocal(); render(); }
  }catch(e){ db = null; }
}

function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function weekCounts(n){
  const now = weekStart(new Date()), out=[];
  for(let k=n-1;k>=0;k--){ const a=new Date(now); a.setDate(a.getDate()-7*k); const b=new Date(a); b.setDate(b.getDate()+7);
    out.push(S.sessions.filter(s=>{const d=new Date(s.date); return d>=a && d<b;}).length); }

}
function streak(){

function arc(cx,cy,r,a0,a1){
  const p=a=>[cx+r*Math.cos((a-90)*Math.PI/180), cy+r*Math.sin((a-90)*Math.PI/180)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1);
  return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;

function ringSVG(lit){

const ymd = d => { const x = new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const parseYmd = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const daysSince = s => Math.round((parseYmd(ymd(new Date())) - parseYmd(s)) / 864e5);
const fmtKg = v => (Math.round(v*10)/10).toString()+" kg";

function bodyStats(){

  const start = +P.startW || (w[0] ? w[0].w : null);

// Weight and reps as two separate cards (or one card of seconds for timed exercises).

function doneLabel(){
  const it = S.plan.items[focus.i], j = selSet ?? 0, s = it.sets[j];
  const left = it.sets.filter(x=>!x.done).length;
  const others = S.plan.items.some((x,k)=>k!==focus.i && !itemState(x).all);
  if(!s || s.done) return null;
  if(isTimed(it.ex)) return {act:"hold", text:`Start set ${j+1} · ${+s.w||30} s`};
  if(left<=1) return others ? {act:"done", text:"Finish exercise"} : {act:"done", text:"Finish workout"};
  return {act:"done", text:`Done, set ${j+1}`};
}
function dockHTML(){

function numCards(it, i, j, s){

  if(isTimed(it.ex)) return `<div class="nums one">${card("secs","w","numeric",s.w,"30","seconds","Seconds","−5","+5","5 seconds less","5 seconds more")}</div>`;
  return `<div class="nums">${card("kg","w","decimal",s.w,"0","kg","Weight in kg","−","+","Less weight","More weight")}${card("reps","r","numeric",s.r,"0","reps","Reps","−","+","Fewer reps","More reps")}</div>`;

function exStats(){

}

  const pts = h.map(x=>({v:val(x), label: x.s.date ? new Date(x.s.date).toLocaleDateString(undefined,{day:"numeric",month:"short"}) : "sheet"})).filter(p=>p.v>0);

// Lightweight SVG line chart. pts: [{v, label}] in time order.
function lineChart(pts, unit, opts={}){
  const W=340, H=160, L=40, R=12, T=14, B=24;
  const vals = pts.map(p=>p.v).concat(opts.goal ? [opts.goal] : []);
  let mx = Math.max(...vals), mn = Math.min(...vals);
  if(mx===mn){ mx+=1; mn-=1; }
  const padv = (mx-mn)*.12; mx+=padv; mn-=padv;
  const X = i => pts.length===1 ? (L+W-R)/2 : L + i*(W-L-R)/(pts.length-1);
  const Y = v => T + (mx-v)/(mx-mn)*(H-T-B);
  const r1 = v => Math.round(v*10)/10;
  const hi = Math.max(...pts.map(p=>p.v)), lo = Math.min(...pts.map(p=>p.v));
  const grid = [hi, lo].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--mut)">${r1(v)}</text>`).join("");
  const goal = opts.goal ? `<line x1="${L}" x2="${W-R}" y1="${Y(opts.goal).toFixed(1)}" y2="${Y(opts.goal).toFixed(1)}" stroke="var(--neon-txt)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".7"/><text x="${W-R}" y="${(Y(opts.goal)-5).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--neon-txt)">goal ${r1(opts.goal)}</text>` : "";
  const xy = pts.map((p,i)=>[X(i).toFixed(1), Y(p.v).toFixed(1)]);
  const line = pts.length>1 ? `<polyline fill="none" stroke="var(--neon)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${xy.map(a=>a.join(",")).join(" ")}"/>` : "";
  const dots = xy.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="${i===xy.length-1?4.5:2.6}" fill="var(--neon)"/>`).join("");
  const xl = pts.length ? `<text x="${L}" y="${H-6}" font-size="11" fill="var(--mut)">${esc(pts[0].label||"")}</text>${pts.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--mut)">${esc(pts[pts.length-1].label||"")}</text>`:""}` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"Chart")}, from ${r1(pts[0].v)} to ${r1(pts[pts.length-1].v)} ${unit}">${grid}${goal}${line}${dots}${xl}</svg>`;
}

function restorePlan(v){

  const sheetNew = !!(v.sheet && v.sheet.done && !(S.sheet && S.sheet.done));

}
function applyRestore(v){

  r.newWi.forEach(w=>S.weighins.push({id:w.id, date:w.date, w:+w.w, waist:+w.waist||null, chest:+w.chest||null, arm:+w.arm||null}));
  r.custom.forEach(c=>S.custom.push(c));

function ding(){

  sess.items.forEach(it=>{ sets += it.sets.length;
    musclesOf(it.ex).forEach(m=>{ if(!ms.includes(m)) ms.push(m); });
    it.sets.forEach(x=>{ if(isTimed(it.ex)) secs += +x.w||0; else { reps += +x.r||0; volume += (+x.w||0)*(+x.r||0); } }); });
  return {exercises:sess.items.length, sets, volume:Math.round(volume), reps, secs, muscles:ms};
}
// PRs and improvements in one workout, judged only against what came before it.
function sessionHighlights(sess, prior){
  const prs = [], ups = [], missed = [];
  sess.items.forEach(it=>{
    const prevItems = []; prior.forEach(x=>x.items.forEach(y=>{ if(y.ex===it.ex) prevItems.push(y); }));
    if(!prevItems.length) return;
    const name = exById(it.ex)?.name || "Unknown", timed = isTimed(it.ex);
    const pool = []; prevItems.forEach(y=>y.sets.forEach(x=>pool.push({w:+x.w||0, r:+x.r||0})));
    let best = null;
    it.sets.forEach(x=>{ const w=+x.w||0, r=+x.r||0; let hit=null;
      if(timed){ if(w > Math.max(...pool.map(p=>p.w))) hit = `${w} s hold`; }
      else if(w>0 && w > Math.max(...pool.map(p=>p.w))) hit = `${r1(w)} kg × ${r}`;
      else { const at = pool.filter(p=>p.w>=w); if(r>0 && at.length && r > Math.max(...at.map(p=>p.r))) hit = w ? `${r} reps at ${r1(w)} kg` : `${r} reps`; }
      if(hit) best = hit; pool.push({w, r}); });
    if(best) prs.push({ex:it.ex, name, label:best});
    const last = prevItems[prevItems.length-1], a = topSet(it), b = topSet(last);
    const aw=+a.w||0, ar=+a.r||0, bw=+b.w||0, br=+b.r||0;
    if(timed){ if(aw>bw) ups.push({ex:it.ex, name, text:`${aw} s, up from ${bw} s`}); return; }
    if(aw>bw) ups.push({ex:it.ex, name, text:`${r1(aw)} kg, up from ${r1(bw)} kg`});
    else if(aw===bw && ar>br) ups.push({ex:it.ex, name, text:`${ar} reps${aw?` at ${r1(aw)} kg`:""}, up from ${br}`});
    else if(aw===bw && ar<br) missed.push({ex:it.ex, name, w:aw, r:ar, lastR:br});
  });
  return {prs, ups, missed};
}
// Most recent earlier workout that trained mostly the same muscles (same gym / no-gym kind).
function similarWorkout(sess, prior){
  const main = new Set(sess.items.map(it=>musclesOf(it.ex)[0]).filter(Boolean));
  const cands = prior.filter(x=>x.date && !!x.nogym===!!sess.nogym).reverse();
  const score = x => { const m = new Set(x.items.map(it=>musclesOf(it.ex)[0]).filter(Boolean)); const inter=[...m].filter(k=>main.has(k)).length; return inter/(new Set([...m,...main]).size||1); };
  return cands.find(x=>score(x)>=.4) || cands.find(x=>score(x)>0) || null;
}
function buildSummary(sess, withRecs){
  const prior = priorSessions(sess), st = sessionStats(sess), hl = sessionHighlights(sess, prior);
  const sim = similarWorkout(sess, prior);
  let compare = null;
  if(sim){ const ps = sessionStats(sim), useVol = st.volume>0 && ps.volume>0;
    const a = useVol ? st.volume : st.reps, b = useVol ? ps.volume : ps.reps;
    if(b>0) compare = {id:sim.id, date:sim.date, metric: useVol?"volume":"reps", pct: Math.round((a-b)/b*100), prev:b}; }
  const out = {v:1, ...st, prs:hl.prs, ups:hl.ups, compare};
  if(withRecs) out.recs = recommendations(sess, hl);
  return out;
}
// Rule-based tips from your own history, most useful first, at most 4.
function recommendations(sess, hl){
  const recs = [];
  const missedEx = new Set(hl.missed.map(m=>m.ex));      // reps dropped today: don't push the weight yet
  sess.items.forEach(it=>{ if(recs.length>=2 || missedEx.has(it.ex)) return; const pl = plateauOf(it.ex), h = pl && overloadHint(it.ex);
    if(h && h.plateau) recs.push({kind:"plateau", title:exById(it.ex)?.name||"", text:h.text}); });
  hl.missed.slice(0,2).forEach(m=>recs.push({kind:"missed", title:m.name,
    text: m.w ? `${m.r} reps at ${r1(m.w)} kg today, ${m.lastR} last time. Keep ${r1(m.w)} kg next time and aim for ${m.lastR}.` : `${m.r} reps today, ${m.lastR} last time. Aim for ${m.lastR} again next time.`}));
  const dated = S.sessions.filter(x=>x.date);
  if(dated.length>=3){
    const lastHit = {}; dated.forEach(x=>x.items.forEach(it=>musclesOf(it.ex).forEach(m=>{ const t=new Date(x.date).getTime(); if(!lastHit[m]||t>lastHit[m]) lastHit[m]=t; })));
    const cut = Date.now()-7*864e5, stale = Object.keys(MUSCLES).filter(m=>!lastHit[m] || lastHit[m]<cut);
    if(stale.length) recs.push({kind:"muscles", title:"Next workout", text:`Not trained in 7+ days: ${muscleNames(stale).slice(0,4).join(", ")}. Worth including next time.`});
  }
  const due = weighInDue();
  if(due) recs.push({kind:"weigh", title:"Weigh-in", text: due.first ? "Log your first weigh-in to start your weight chart." : `Your last weigh-in was ${due.days} days ago. A quick one keeps your chart up to date.`});
  return recs.slice(0,4);
}
// Summaries for workouts from before this feature are rebuilt from their logged sets (never written back).
let _sumCache = {key:"", map:{}};
function summaryOf(sess){
  if(sess.summary) return sess.summary;
  const key = S.sessions.length+":"+(S.sessions[S.sessions.length-1]?.id||"");
  if(_sumCache.key!==key) _sumCache = {key, map:{}};
  return _sumCache.map[sess.id] || (_sumCache.map[sess.id] = buildSummary(sess, false));
}
let showAllSummaries = false;
function summariesSection(){
  const list = S.sessions.filter(x=>x.date).slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length) return "";
  const shown = showAllSummaries ? list : list.slice(0,5);
  return `<section class="list"><div class="sec"><span>Summaries</span>${list.length>5?`<button class="link" data-act="sumall">${showAllSummaries?"Show fewer":`Show all ${list.length}`}</button>`:""}</div>
    ${shown.map(x=>{ const sm = summaryOf(x), vol = sm.volume>0;
      return `<button class="row" data-act="summary" data-id="${esc(x.id)}"><span class="nm">${esc(sessionTitle(x))}${sm.prs.length?` <span class="prbadge sm">${sm.prs.length} PR${sm.prs.length>1?"s":""}</span>`:""}<small>${esc(fmtDate(x.date))}${x.nogym?" · No gym":""}</small></span>
        <span class="m sumv"><span>${esc(fmtDur(sm.durMin))}</span><b class="${vol?"kgv":"repsv"}">${vol?sm.volume.toLocaleString()+" kg":sm.reps+" reps"}</b></span></button>`; }).join("")}
  </section>`;
}
function summaryHTML(sess){
  const sm = summaryOf(sess), title = sessionTitle(sess);
  const vol = sm.volume>0;
  const cmp = sm.compare ? (()=>{ const ref = S.sessions.find(x=>x.id===sm.compare.id); const nm = ref ? sessionTitle(ref) : "your last similar workout";
    const sign = sm.compare.pct>0?"+":sm.compare.pct<0?"−":"±";
    return `<p class="sm-cmp"><b class="${sm.compare.pct>0?"good":""}">${sign}${Math.abs(sm.compare.pct)}%</b> ${sm.compare.metric} vs ${esc(nm)}${sm.compare.date?`, ${esc(fmtDate(sm.compare.date))}`:""}</p>`; })() : `<p class="sm-cmp">No similar earlier workout to compare with yet.</p>`;
  const hl = sm.prs.map(x=>`<li><span class="prbadge sm">PR</span><span><b>${esc(x.name)}</b> ${esc(x.label)}</span></li>`).join("")
    + sm.ups.filter(u=>!sm.prs.some(p=>p.ex===u.ex)).map(x=>`<li><span class="upmark" aria-hidden="true">▲</span><span><b>${esc(x.name)}</b> ${esc(x.text)}</span></li>`).join("");
  const recs = sm.recs ? (sm.recs.length ? `<h3 class="sm-h">Recommendations</h3><ol class="recs">${sm.recs.map(r=>`<li class="rec ${r.kind}"><b>${esc(r.title)}</b><span>${esc(r.text)}</span></li>`).join("")}</ol>` : `<h3 class="sm-h">Recommendations</h3><p class="fine">Nothing to change. Keep going.</p>`) : `<p class="fine">Recommendations are only made for workouts finished after summaries were added.</p>`;
  return `<p class="how open">${esc(title)}${sess.date?`, ${esc(fmtDate(sess.date))}`:""}${sess.nogym?" · No gym":""}</p>
    <div class="sm-grid">
      <div><b>${esc(fmtDur(sm.durMin))}</b><span>duration</span></div>
      <div><b>${sm.exercises}</b><span>exercises</span></div>
      <div><b>${sm.sets}</b><span>sets</span></div>
      <div class="${vol?"kgc":"repsc"}"><b>${vol?sm.volume.toLocaleString():sm.reps}</b><span>${vol?"kg volume":"total reps"}</span></div>
    </div>
    ${cmp}
    <h3 class="sm-h">Muscles trained</h3><div class="mchips">${muscleNames(sm.muscles).map(m=>`<span>${esc(m)}</span>`).join("")}</div>
    <h3 class="sm-h">Highlights</h3>${hl?`<ul class="hl">${hl}</ul>`:`<p class="fine">No PRs or step-ups this time. Steady work counts too.</p>`}
    ${recs}`;
}

/* ---------- Done button + undo ---------- */
let undoState = null, undoTimer = null, justDone = null;
function snapshotForUndo(label){
  undoState = {plan: JSON.parse(JSON.stringify(S.plan)), focus: focus ? {...focus} : null, selSet, rest: rest ? {...rest} : null, session: null, tab};
  return label;
}
function doneSet(){
  if(!focus || !S.plan) return;
  const i = focus.i, it = S.plan.items[i], j = selSet ?? it.sets.findIndex(x=>!x.done);
  if(j<0 || !it.sets[j] || it.sets[j].done) return;
  const label = doneLabel()?.text || "";
  const v = it.sets[j];
  snapshotForUndo();
  completeAt(i, j);
  justDone = {i, j};
  try{ navigator.vibrate && navigator.vibrate(35); }catch(_){}
  const what = isTimed(it.ex) ? `${+v.w||0} s` : `${+v.w ? r1(+v.w)+" kg × " : ""}${+v.r||0}${+v.w?"":" reps"}`;
  if(label==="Finish workout"){
    const sess = finish(true);
    if(sess){ undoState.session = sess.id; showUndo(`Set ${j+1} logged, workout saved`); }
    return;
  }
  render(false);
  setTimeout(()=>{ justDone = null; }, 400);
  showUndo(`Set ${j+1} logged: ${what}`);
}
function showUndo(msg){
  document.querySelector(".utoast")?.remove(); clearTimeout(undoTimer);
  const t = document.createElement("div"); t.className = "utoast"; t.setAttribute("role","status");
  t.innerHTML = `<span>${esc(msg)}</span><button type="button">Undo</button>`;
  t.querySelector("button").addEventListener("click", undoLast);
  document.body.appendChild(t);
  undoTimer = setTimeout(()=>{ t.remove(); undoState = null; }, 5000);
}
function undoLast(){
  const u = undoState; if(!u) return;
  undoState = null; clearTimeout(undoTimer); document.querySelector(".utoast")?.remove();
  if(u.session){                                   // the workout was just saved: take it back out
    S.sessions = S.sessions.filter(x=>x.id!==u.session);
    if(db) ref("s-"+u.session).delete().catch(()=>{});
    sheet = null; tab = u.tab;
  }
  S.plan = u.plan; focus = u.focus; selSet = u.selSet; rest = null; justDone = null; releaseWake();
  persistPlan(); saveLocal(); render(false); toast("Undone");
}
function completeAt(i,j,carry=true){
  const it=S.plan.items[i]; if(!it || !it.sets[j]) return;
  const cs=it.sets[j]; cs.done=true;
  if(!S.plan.started) S.plan.started = Date.now();
  const pr = prFor(i,j); if(pr){ cs.pr = pr.kind; prToast(pr); } else delete cs.pr;
  if(carry) it.sets.forEach((x,k)=>{ if(k>j && !x.done){ x.w=cs.w; x.r=cs.r; } });
  if(focus && focus.i===i){
    const nx = it.sets.findIndex(s=>!s.done);
    if(nx>=0) selSet=nx;
    focus.edit = false;      // all sets done → the Up next card replaces the inputs
  }
  persistPlan();
  if(!S.plan.items.every(x=>itemState(x).all)) startRest();
}
function holdHTML(){
  const left = hold.end-Date.now();
  return `<div class="rest hold" role="timer" aria-label="Hold, set ${hold.j+1}">
    <div class="rest-top"><span class="rest-l">Hold, set ${hold.j+1}</span><span class="rest-t" id="holdT">${fmtT(left)}</span></div>
    <div class="rest-line"><i id="holdL" style="transform:scaleX(${Math.max(0,left/hold.total).toFixed(3)})"></i></div>
    <div class="rest-b"><button class="link danger" data-act="holdcancel">Cancel</button><span class="sp"></span><button class="link" data-act="holdstop">Done early</button></div></div>`;
}
function tickHold(){
  if(!hold) return;
  const left = hold.end-Date.now();
  if(left<=0){
    const h=hold; hold=null; ding(); try{ navigator.vibrate && navigator.vibrate([250,120,250]); }catch(_){}
    completeAt(h.i,h.j);
    if(focus) render(false); else toast("Hold done");
    return;
  }
  const t=document.getElementById("holdT"), l=document.getElementById("holdL");
  if(t) t.textContent = fmtT(left);
  if(l) l.style.transform = `scaleX(${(left/hold.total).toFixed(3)})`;
}
function tickRest(){
  tickHold();
  if(!rest || rest.over) return;
  const left = rest.end-Date.now();
  if(left<=0) return restOver();
  const t=document.getElementById("restT"), l=document.getElementById("restL");
  if(t){ t.textContent = fmtT(left); t.classList.toggle("last5", left<=5000); }
  if(l) l.style.transform = `scaleX(${(left/rest.total).toFixed(3)})`;
}
setInterval(tickRest, 250);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ tickRest(); if(rest && !rest.over) holdWake(); } });

/* ---------- start ---------- */
loadLocal();
const h = location.hash.slice(1); if(["today","exercises","history","body"].includes(h)) tab=h;
if(h==="weighin"){ tab="body"; sheet={type:"weighin"}; }
render();
window.addEventListener("hashchange", ()=>{ if(location.hash==="#weighin"){ focus=null; tab="body"; sheet={type:"weighin"}; render(false); } });
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
