SR_DESC = {"0":"Lezi na klupu, stopala čvrsto na podu, lopatice skupljene. Spusti šipku do sredine grudi sa laktovima oko 45° od tela, pa potisni pravo gore.","1":"Stopala u širini kukova, šipka iznad sredine stopala. Savij se u kukovima i uhvati šipku odmah izvan nogu, grudi gore i leđa ravna, pa se uspravi potiskujući kroz pete. Spuštaj je na isti način.","2":"Drži jednu bučicu uspravno uz grudi. Sedi unazad i nadole dok lagano ne dodirneš kutiju, grudi drži gore, pa se vrati gore potiskujući kroz pete.","3":"Bench press sa šakama otprilike u širini ramena. Drži laktove uz telo da bi opteretio tricepse.","4":"Stani uspravno sa bučicama ispred butina. Gurni kukove unazad uz blago savijena kolena, spuštajući tegove niz noge dok ne osetiš istezanje zadnje lože, pa stegni gluteuse i uspravi se.","5":"Klupa na 30–45°. Kreni sa bučicama u visini grudi, dlanovi napred, i potisni gore i blago ka unutra. Spuštaj polako dok ne osetiš istezanje u grudima.","6":"Stani sa bučicama pored tela, laktovi priljubljeni uz rebra. Podigni ih bez zamaha, stegni na vrhu i spuštaj polako.","7":"Podlaktice ispod ramena, telo u pravoj liniji od glave do peta. Zategni stomak i stegni gluteuse, i ne dozvoli da ti kukovi propadnu ili odu gore.","8":"Na klupi za hiperekstenziju, kukovi na jastučetu. Spusti gornji deo tela ravnih leđa, pa se podigni dok telo ne bude u pravoj liniji. Ne zabacuj se previše na vrhu.","9":"Bučice pored tela, laktovi blago savijeni. Podigni ruke u stranu do visine ramena, vodeći laktovima, pa spuštaj polako.","10":"Drži ploču ispruženim rukama ispred sebe u visini grudi. Sedi unazad na kutiju i ustani, ploča miruje, grudi gore.","11":"Iz visokog planka iskorači jednom nogom u stranu i vrati je, pa drugom. Kukovi u ravni, trup zategnut.","12":"Potisak šipke na klupi pod 30–45°. Spusti šipku do gornjeg dela grudi i potisni pravo gore iznad ramena.","13":"Lezi na leđa, šake ispod kukova, donji deo leđa pritisnut uz pod. Podigni noge malo od poda i ukrštaj ih široko i kontrolisano.","14":"Lezi na leđa, noge malo iznad poda. Naizmenično ih podiži i spuštaj kao makaze, donji deo leđa drži uz pod.","15":"Dlanovi okrenuti jedan ka drugom sve vreme. Podigni bučice sa laktovima fiksiranim uz telo, pa spuštaj polako.","16":"Stopala u širini ramena, na sredini platforme. Spuštaj dok kolena ne budu na oko 90°, a da ti se donji deo leđa ne odvoji od naslona, pa potisni nazad bez zaključavanja kolena.","17":"Sedi na ivicu klupe, ruke iza sebe kao oslonac. Nagni se unazad i ispruži noge, pa privuci kolena ka grudima dok trup ide napred.","18":"Bučica između stopala. Jednim eksplozivnim pokretom odgurni se nogama i kukovima i povuci teg pravo iznad glave, završavajući sa zaključanom rukom. Spusti kontrolisano i promeni stranu.","19":"Na jednoj podlaktici, lakat ispod ramena, stopala jedno na drugom. Podigni kukove da telo bude u pravoj liniji i zadrži. Promeni stranu.","20":"Šake na klupi malo šire od ramena, telo pravo. Spusti grudi do ivice klupe i odgurni se nazad gore.","21":"Kreni sa dlanovima okrenutim ka butinama i rotiraj ih nagore dok podižeš, tako da mali prst završi više od palca. Spuštaj polako i vrati rotaciju.","22":"Jastuče odmah iznad peta. Savij noge povlačeći pete ka gluteusima, zastani, pa spuštaj polako. Kukove drži pritisnute uz jastuče.","23":"Lezi na leđa, kolena savijena. Podigni ramena od poda snagom stomaka, ne vrata, pa spuštaj polako.","24":"Stani na jednu nogu sa bučicama u rukama. Nagni se napred dok slobodna noga ide pravo unazad, dok telo ne bude skoro paralelno sa podom, pa se vrati. Kukovi ostaju u ravni.","25":"Lezi na leđa, noge pravo gore. Posegni rukama ka prstima stopala, podižući ramena od poda, pa spuštaj polako.","26":"Uhvati EZ šipku na zakrivljenim delovima, laktovi uz telo. Podigni bez zabacivanja unazad, pa spuštaj polako.","27":"Šake na ivici klupe iza tebe, noge ispružene, pete na podu. Savij laktove do oko 90°, leđa blizu klupe, pa se potisni gore.","28":"Visi na šipki. Podigni kolena gore i dijagonalno ka jednom ramenu, spusti kontrolisano, pa na drugu stranu.","29":"Lezi na klupu, bučice iznad grudi, laktovi blago savijeni. Raširi ruke dok ne osetiš istezanje u grudima, pa ih u luku vrati zajedno.","30":"Drži bučicu na grudima ili iza vrata. Blago opusti kolena i nagni se napred ravnih leđa dok trup ne bude skoro paralelan sa podom, pa se vrati snagom zadnje lože i gluteusa.","31":"Šake ispod ramena ili uže, laktovi uz telo. Spusti grudi i odgurni se gore, telo pravo.","32":"Iskorači jednom nogom unazad i spusti se dok oba kolena ne budu na oko 90°, prednje koleno iznad članka. Odgurni se prednjom petom nazad.","33":"Na gornjoj sajli, pothvatom na pravoj šipki. Laktovi priljubljeni uz telo, potiskuj nadole dok ruke ne budu ispružene, pa pusti da se polako vrati.","34":"Bučice pored tela. Sedi unazad na kutiju, grudi gore, pa se odgurni gore kroz pete.","35":"Lezi na klupu, bučice u visini grudi. Potisni gore dok ruke ne budu ispružene, pa spuštaj polako do istezanja.","36":"Uhvati šipku šire od ramena. Blago se zabaci i povuci šipku do gornjeg dela grudi, vodeći laktove nadole, pa je kontrolisano vrati gore.","37":"Kao bench dips, ali sa savijenim kolenima i stopalima blizu klupe. Lakše od verzije sa ispruženim nogama.","38":"Bučice u visini ramena, dlanovi napred. Zategni trup i potisni iznad glave bez izvijanja leđa, pa spusti do ramena.","39":"Šipka na gornjem delu leđa, stopala u širini ramena. Spusti se dole i unazad dok butine ne budu bar paralelne sa podom, kolena prate prste, pa se odgurni gore.","40":"Šipka na gornjem delu leđa. Blago opusti kolena i nagni se iz kukova ravnih leđa dok trup ne bude skoro paralelan sa podom, pa se vrati.","41":"Drži po jednu bučicu u svakoj ruci iznad glave, dlanovi okrenuti jedan ka drugom. Spusti ih iza glave savijajući samo laktove, pa ispruži nazad gore.","42":"Kao Romanian deadlift, ali sa opruženijim nogama. Nagni se napred ravnih leđa, oseti istezanje zadnje lože i vrati se gore.","43":"Drži ploču iznad glave ispruženim rukama. Sedi unazad na kutiju i ustani, ploča sve vreme iznad ramena.","44":"Šipka na prednjem delu ramena, laktovi visoko. Čučni sa uspravnim trupom i odgurni se nazad gore.","45":"Drži girju u pregibu laktova, uz telo. Čučni sa grudima gore i ustani.","46":"Leđa ravno uz zid, stopala blizu jedno drugog, kolena pod 90°. Zadrži položaj.","47":"Šake na ivici klupe iza tebe. Spuštaj se dok laktovi ne budu na oko 90°, leđa blizu klupe, pa se potisni gore.","48":"Šipka u visini ključnih kostiju, šake malo šire od ramena. Zategni trup i potisni iznad glave, blago pomerajući glavu unazad da propustiš šipku, pa spusti.","49":"Kreni sa bučicama u visini brade, dlanovi ka tebi. Potiskuj gore rotirajući dlanove napred, pa obrnuto pri spuštanju.","50":"Lezi na leđa, kolena savijena i stopala podignuta. Podigni se trbušnjacima i posegni rukama ka prstima stopala, pa spuštaj polako.","51":"Ručke sa donjih sajli. Ruke blago savijene, povuci šake nagore i spoji ih ispred gornjeg dela grudi, pa spuštaj polako.","52":"Uhvati šipku na donjoj sajli, laktovi uz telo. Podigni, stegni i spusti kontrolisano.","53":"Ruke ispružene napred radi ravnoteže. Sedi unazad na kutiju i ustani kroz pete.","54":"Jedna ruka i koleno na klupi, leđa ravna. Povuci bučicu ka kuku, lakat blizu tela, pa spusti do punog istezanja.","55":"Nadlaktice ravno na jastučetu Skotove klupe. Podigni šipku, pa spuštaj polako dok ruke ne budu skoro ispružene.","56":"Drži jednu bučicu između nogu ili na grudima. Sedi na kutiju i ustani.","57":"Na gornjoj sajli, nathvatom. Laktovi priljubljeni uz telo, potiskuj nadole dok ruke ne budu ispružene, pa pusti da se polako vrati.","58":"Stani bočno do donje sajle, ručka u daljoj ruci. Podigni ruku u stranu do visine ramena i spuštaj polako.","59":"Visi na šipki. Podigni noge ispred sebe bez ljuljanja, pa ih spusti kontrolisano.","60":"U planku na podlakticama rotiraj kukove i spusti jednu stranu ka podu, pa drugu, ramena miruju.","61":"Na leđima, podigni se trbušnjacima i privuci jedan lakat ka suprotnom kolenu. Menjaj strane.","62":"Leđima okrenut donjoj sajli, ručka u jednoj ruci. Podigni ispruženu ruku ispred sebe do visine ramena i spuštaj polako.","63":"Širok nathvat na šipki. Povuci je do gornjeg dela grudi vodeći laktove nadole i unazad, pa je polako vrati.","64":"Zamahni rukama i skoči napred što dalje možeš, doskoči meko na obe noge savijenih kolena. Namesti se i ponovi.","65":"Raskorak, jedna noga napred. Spusti se pravo dole dok oba kolena ne budu na oko 90°, pa se podigni. Stopala ostaju na mestu, prvo uradi sva ponavljanja na jednu stranu.","66":"Stojeći ili ležeći, privuci jedan lakat ka suprotnom kolenu uz rotaciju trupa, pa promeni stranu.","67":"Ručke sa gornjih sajli. Ruke blago savijene, povuci šake nadole i spoji ih ispred kukova, pa ih polako raširi.","68":"Širok stav sa prstima okrenutim napolje, hvat unutar kolena. Grudi gore i leđa ravna, stopalima guraj pod u stranu i uspravi se.","69":"Leđima okrenut gornjoj sajli, uže iza glave. Laktovi pokazuju napred, ispruži ruke iznad glave, pa se polako vrati.","70":"Drži bučice na prednjem delu ramena. Čučni sa uspravnim trupom, pa se odgurni gore.","71":"Na kosoj klupi, bučice iznad grudi. Raširi ruke u širokom luku sa blago savijenim laktovima, pa ih vrati zajedno.","72":"Stopala u širini ramena, ruke napred. Spusti se dok butine ne budu paralelne sa podom, pa ustani.","73":"Nagni se napred licem ka donjoj sajli, sa užetom. Povuci uže ka stomaku stežući lopatice, pa polako ispruži ruke.","74":"Stavi celo stopalo na klupu i odgurni se tom petom da se popneš. Siđi kontrolisano i ponovi. Uradi obe noge.","75":"Klupa podignuta visoko, oko 45–60°. Potisni šipku sa gornjeg dela grudi pravo gore. Radi gornji deo grudi i prednja ramena.","76":"Jastuče na donjem delu potkolenica. Ispruži noge, stegni kvadricepse na vrhu i spuštaj polako.","77":"Iskorači široko u stranu i sedi u taj kuk, druga noga ostaje ispružena. Odgurni se nazad u stojeći položaj i promeni stranu.","78":"Nadlaktice na jastučetu, uhvati ručke. Podigni, stegni i spusti kontrolisano.","79":"Drži šipku iznad glave uskim hvatom. Spusti je iza glave savijajući laktove, pa ispruži nazad gore.","80":"Grudi uz jastuče, uhvati ručke. Povuci unazad vodeći laktovima, stegni lopatice i vrati polako.","81":"Spusti se u četvrt čučnja, zamahni rukama i skoči pravo gore što više možeš. Doskoči meko i namesti se.","82":"Na leđima, šake ispod kukova, noge malo iznad poda. Pravi male, brze pokrete gore-dole ispruženim nogama.","83":"Sedi sa blago savijenim kolenima, dlanovi okrenuti jedan ka drugom na ručki. Povuci ka stomaku ravnih leđa, pa polako ispruži ruke.","84":"Širok hvat. Povuci šipku iza glave do baze vrata, pa je polako vrati. Idi samo onoliko nisko koliko ti ramena udobno dozvoljavaju.","85":"Šake šire od ramena. Spusti grudi do poda i odgurni se gore, telo u pravoj liniji.","86":"Nagni se napred, nadlaktica paralelna sa podom. Ispruži podlakticu unazad dok ruka ne bude prava, pa vrati. Nadlaktica miruje.","87":"Bučice ispred butina. Podigni ih ispred sebe do visine ramena skoro ispruženim rukama, pa spuštaj polako.","88":"Stopala blizu jedno drugog, čučni otprilike do paralele i zadrži položaj.","89":"Širok stav, prsti napolje. Čučni pravo dole gurajući kolena napolje, pa ustani.","90":"Na leđima, kolena savijena i stopala podignuta. Podigni se trbušnjacima i posegni ka prstima stopala, pa se spusti.","91":"Sedi, prava šipka na donjoj sajli. Povuci je ka stomaku ravnih leđa, pa polako ispruži ruke.","92":"Pothvat, šake u širini ramena. Povuci šipku do gornjeg dela grudi, laktovi blizu tela, pa pusti da se polako vrati. Više radi biceps nego široki hvat.","93":"Skači bočno s jedne strane na drugu, privlačeći kolena ka grudima u svakom skoku. Doskoči meko.","94":"Šake blizu jedna drugoj na klupi, laktovi uz telo. Spusti grudi do klupe i odgurni se gore.","95":"Hammer curl sa pauzom od 1–2 sekunde na pola puta i na vrhu. Spuštaj polako.","96":"Na leđima, kolena savijena. Podigni trup ka kolenima i spuštaj polako.","97":"Šipka na prednjem delu ramena. Potisni je iznad glave sa zategnutim trupom, pa je spusti nazad do ključnih kostiju.","98":"Sedeći, drži jednu bučicu iznad glave obema rukama. Spusti je iza glave savijajući laktove, pa ispruži nazad gore.","99":"Osloni se na razboj ispruženim rukama. Spuštaj se dok laktovi ne budu pod 90°, trup uspravan da radi triceps, pa se potisni gore.","100":"Prava šipka na donjoj sajli, laktovi uz telo. Podigni, stegni i spuštaj polako.","101":"Uže na gornjoj sajli, laktovi priljubljeni. Potiskuj nadole i na dnu raširi krajeve užeta, pa se polako vrati.","102":"Iz planka na podlakticama podigni se u visoki plank, jednu po jednu ruku, pa se vrati dole. Menjaj ruku kojom počinješ.","103":"U planku podigni jednu ispruženu nogu iz kuka, kratko zadrži i spusti. Menjaj noge bez rotiranja kukova.","104":"Šake na klupi ili kutiji. Spusti se i eksplozivno odgurni tako da ti se šake odvoje od podloge, pa doskoči meko i odmah kreni u sledeće ponavljanje.","105":"Šake blizu jedna drugoj na bugarskoj vreći. Spusti grudi do vreće i odgurni se gore, laktovi uz telo.","106":"Čučni do paralele, pa eksplozivno skoči gore. Doskoči meko i odmah idi u sledeći čučanj.","107":"Licem ka donjoj sajli, pothvatom. Povuci šipku ka stomaku, laktovi blizu tela, pa polako ispruži ruke.","108":"Nagni se napred ravnih leđa, bučice vise. Povuci ih ka kukovima, stegni lopatice, pa spusti.","109":"Zadnje stopalo na klupi iza tebe, bučice pored tela. Spusti se dok prednja butina ne bude paralelna sa podom, pa se odgurni gore prednjom petom. Uradi obe noge.","110":"Pothvat u širini ramena, laktovi uz telo. Podigni šipku bez zamaha, pa spuštaj polako.","111":"Bučice ispred nogu. Savij se u kukovima i kolenima i spusti ih do visine potkolenica ravnih leđa, pa se uspravi.","112":"Iz skleka sa uskim hvatom eksplozivno se odgurni, pljesni i meko doskoči nazad u položaj.","113":"Sedi sa savijenim kolenima, drži ploču na grudima. Polako se spusti unazad i podigni se snagom stomaka.","114":"Ležeći na leđima, zamahuj spojenim ispruženim nogama s jedne strane na drugu, ramena ostaju na podu.","115":"Iskorači jednom nogom unazad i ukoso iza druge u iskorak, posegni ka prstima prednjeg stopala, pa se vrati. Menjaj strane.","116":"Skokom raširi noge dok podižeš ruke iznad glave, pa se skokom vrati u početni položaj. Drži ujednačen ritam.","117":"Širok stav, prsti napolje, jedna bučica između nogu. Čučni pravo dole gurajući kolena napolje, pa ustani.","118":"Bučice ispred butina. Povuci ih pravo gore do visine grudi, vodeći laktovima, pa spuštaj polako.","119":"Nagni se napred, bučice vise. Podigni ruke u stranu, stežući zadnja ramena, pa spuštaj polako.","ng-push-up":"Šake malo šire od ramena, telo u pravoj liniji. Spusti grudi do poda i odgurni se nazad gore.","ng-decline-push-up":"Stopala na stolici ili krevetu, šake na podu. Telo drži pravo, spusti grudi do poda i odgurni se gore. Više radi gornji deo grudi.","ng-archer-push-up":"Šake veoma široko. Spuštaj se ka jednoj šaci dok je druga ruka skoro ispružena, odgurni se gore, pa na drugu stranu.","ng-chair-dips":"Šake na ivici stabilne stolice iza tebe, kolena savijena. Spuštaj se dok laktovi ne budu na oko 90°, pa se potisni gore. Leđa drži blizu stolice.","ng-diamond-push-up":"Šake zajedno ispod grudi, palčevi i kažiprsti prave dijamant. Laktovi uz telo dok se spuštaš i odguruješ gore.","ng-pike-push-up":"Kukovi visoko, telo u obrnutom V. Savij laktove i spusti teme glave ka podu između šaka, pa se odgurni nazad gore.","ng-plank-shoulder-taps":"Visoki plank, stopala malo šire od kukova. Dodirni jedno rame suprotnom šakom, pa promeni, kukovi miruju.","ng-floor-y-t-raises":"Lezi na stomak, čelo malo iznad poda. Podigni ispružene ruke u Y, spusti, pa ih podigni u stranu u T. Stegni lopatice.","ng-table-row":"Lezi ispod stabilnog stola i uhvati ivicu. Telo pravo od peta do ramena, povuci grudi do stola, pa se polako spusti. Prvo proveri da li sto izdržava.","ng-towel-row":"Obmotaj peškir oko stabilnog stuba ili ograde i drži oba kraja. Zabaci se unazad ispruženih ruku sa stopalima blizu stuba, pa povuci grudi ka šakama.","ng-superman-raise":"Lezi na stomak, ruke ispružene napred. Podigni ruke, grudi i noge nekoliko centimetara od poda, zadrži sekundu i spusti.","ng-towel-curl":"Sedi na stolicu i provuci peškir ispod jednog stopala, držeći po jedan kraj u svakoj ruci. Podiži dok stopalo gura nadole da bude teže. Spuštaj polako.","ng-door-frame-curl":"Uhvati se jednom rukom za čvrst dovratak u visini grudi, stopala blizu dovratka. Zabaci se dok ruka ne bude ispružena, pa se privuci nazad. Promeni ruku.","ng-split-squat":"Dugačak raskorak, zadnja peta podignuta. Spusti se pravo dole dok oba kolena ne budu na oko 90°, pa se odgurni gore prednjom petom. Uradi obe noge.","ng-rear-foot-elevated-split-squat":"Zadnje stopalo na stolici iza tebe. Spusti se dok prednja butina ne bude otprilike paralelna sa podom, pa se odgurni gore prednjom petom. Uradi obe noge.","ng-chair-step-up":"Stavi celo stopalo na stabilnu stolicu i odgurni se tom petom da se popneš. Siđi kontrolisano. Uradi obe noge.","ng-wall-sit":"Leđa ravno uz zid, stopala u širini ramena, kolena pod 90°. Zadrži položaj.","ng-single-leg-glute-bridge":"Na leđima, jedno stopalo na podu, druga noga podignuta. Odgurni se petom i podigni kukove dok telo ne bude pravo, pa spusti. Uradi obe noge.","ng-towel-hamstring-slide":"Na leđima, pete na peškiru na glatkom podu. Podigni kukove, pa kliži petama napred dok noge ne budu skoro ispružene i vrati ih nazad.","ng-single-leg-hip-hinge":"Stani na jednu nogu, ruke napred. Nagni se iz kukova dok slobodna noga ide unazad, dok telo ne bude skoro vodoravno, pa se uspravi. Uradi obe noge.","ng-heel-elevated-hamstring-bridge":"Na leđima, pete na stabilnoj stolici, kolena blago savijena. Pritisni petama nadole da podigneš kukove, zadrži sekundu i spuštaj polako. Za težu varijantu radi na jednoj nozi.","ng-forearm-plank":"Podlakti
